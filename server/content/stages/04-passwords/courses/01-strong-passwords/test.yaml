title: "Final Test: Creating Strong Passwords"
description: "Testing your knowledge of password strength, NIST's 2025 guidance, and the RockYou2024 leak."
passingScore: 75
questions:
  - text: "Which password is the strongest?"
    type: SINGLE_CHOICE
    options:
      - text: "Password123"
        isCorrect: false
      - text: "myname1990"
        isCorrect: false
      - text: "qwerty12345"
        isCorrect: false
      - text: "xK8#mP2$vL9@rT4!"
        isCorrect: true

  - text: "According to NIST's 2025 guidance, which factor matters most for password strength?"
    type: SINGLE_CHOICE
    options:
      - text: "Mixing uppercase, lowercase, digits, and symbols"
        isCorrect: false
      - text: "Length"
        isCorrect: true
      - text: "Changing it every 90 days"
        isCorrect: false
      - text: "Spelling a word backwards"
        isCorrect: false

  - text: "Which of these are real changes in NIST's 2025 password guidance?"
    type: MULTI_CHOICE
    options:
      - text: "Minimum recommended length raised to 15 characters"
        isCorrect: true
      - text: "Mandatory rotation removed unless compromise is suspected"
        isCorrect: true
      - text: "Passwords screened against known breached/common lists"
        isCorrect: true
      - text: "Special characters are now mandatory"
        isCorrect: false
      - text: "Security questions are now a required third factor"
        isCorrect: false
      - text: "Passwords must be changed every 30 days"
        isCorrect: false

  - text: "Roughly how many unique passwords did RockYou2024 contain?"
    type: SINGLE_CHOICE
    options:
      - text: "About 10 thousand"
        isCorrect: false
      - text: "About 10 million"
        isCorrect: false
      - text: "About 10 billion"
        isCorrect: true
      - text: "About 10 trillion"
        isCorrect: false

  - text: "What does RockYou2024 mainly demonstrate about password reuse?"
    type: SINGLE_CHOICE
    options:
      - text: "That most modern passwords are unbreakable"
        isCorrect: false
      - text: "That a password leaked in any one of thousands of past breaches ends up in one list attackers test everywhere"
        isCorrect: true
      - text: "That only obviously weak passwords ever leak"
        isCorrect: false
      - text: "That it only affects one specific website"
        isCorrect: false

  - text: "Why does NIST now recommend against forced periodic password changes?"
    type: SINGLE_CHOICE
    options:
      - text: "It's technically impossible to enforce"
        isCorrect: false
      - text: "It tends to produce small, predictable variations of the same password"
        isCorrect: true
      - text: "It makes passwords directly easier to guess"
        isCorrect: false
      - text: "It was never a real recommendation"
        isCorrect: false

  - text: "Which of these passwords would a dictionary attack most likely crack quickly?"
    type: SINGLE_CHOICE
    options:
      - text: "johnsmith1990"
        isCorrect: true
      - text: "xK8#mP2$vL9@rT4!"
        isCorrect: false
      - text: "A random 20-character string"
        isCorrect: false
      - text: "A password generated by a password manager"
        isCorrect: false

  - text: "What's the safest approach to password uniqueness across sites?"
    type: SINGLE_CHOICE
    options:
      - text: "Reuse one strong password everywhere"
        isCorrect: false
      - text: "Use a different, unique password for every site"
        isCorrect: true
      - text: "Reuse a password only on similar types of sites"
        isCorrect: false
      - text: "Change one password on a rotating schedule across all sites"
        isCorrect: false
