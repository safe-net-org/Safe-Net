title: "Итоговый тест: Анатомия email-фишинга"
description: "Проверяет, можете ли вы распознать искусственно созданное давление, прочитать настоящий домен и вспомнить ключевой случай и статистику курса."
passingScore: 80
questions:
  - text: "В billing@paypal-secure.info, какой настоящий домен, с которого пришло сообщение?"
    type: SINGLE_CHOICE
    options:
      - text: "paypal.com"
        isCorrect: false
      - text: "paypal-secure.info"
        isCorrect: true
      - text: "billing.paypal.com"
        isCorrect: false
      - text: "secure.info"
        isCorrect: false

  - text: "Какое сочетание — самый сильный признак фишингового письма?"
    type: SINGLE_CHOICE
    options:
      - text: "Слегка незнакомый логотип"
        isCorrect: false
      - text: "Просьба подтвердить пароль по ссылке плюс срочный дедлайн"
        isCorrect: true
      - text: "Письмо отправлено вне рабочих часов"
        isCorrect: false
      - text: "Длинный, официальный блок подписи"
        isCorrect: false

  - text: "Прочитайте строку: «Поздравляем! Вы выбраны для получения возврата средств. Подтвердите номер карты в течение 1 часа на irs-gov-refunds.net». Выберите все реально присутствующие тревожные признаки."
    type: MULTI_CHOICE
    options:
      - text: "Незаслуженная награда («выбраны для возврата средств»)"
        isCorrect: true
      - text: "Дедлайн в 1 час"
        isCorrect: true
      - text: "Домен, не являющийся настоящим государственным доменом (irs-gov-refunds.net)"
        isCorrect: true
      - text: "Просьба, связанная с налогами"
        isCorrect: false
      - text: "Слово «Поздравляем»"
        isCorrect: false
      - text: "Просьба сообщить номер карты для получения денег"
        isCorrect: true
      - text: "Сообщение написано на английском языке"
        isCorrect: false

  - text: "Во входящих отображается имя отправителя «Служба поддержки банка». Что это имя гарантирует про настоящий адрес отправителя?"
    type: SINGLE_CHOICE
    options:
      - text: "Ничего — отправитель выбрал этот текст свободно, и он не проверяется"
        isCorrect: true
      - text: "Это гарантирует, что домен принадлежит банку"
        isCorrect: false
      - text: "Это гарантирует, что соединение зашифровано"
        isCorrect: false
      - text: "Это гарантирует, что личность отправителя была проверена"
        isCorrect: false

  - text: "В деле против Google и Facebook (Эвалдас Римашаускас, 2013-2015), какая техника позволила вывести примерно 120 миллионов долларов?"
    type: SINGLE_CHOICE
    options:
      - text: "Атака программы-вымогателя, зашифровавшей файлы финансового отдела"
        isCorrect: false
      - text: "Поддельные счета и контракты, выдававшие себя за настоящего поставщика оборудования"
        isCorrect: true
      - text: "Атака с подменой SIM-карты на телефоны финансовых руководителей"
        isCorrect: false
      - text: "Поддельная страница входа в корпоративный VPN"
        isCorrect: false

  - text: "Вы получаете неожиданную, срочную просьбу перейти по ссылке и войти в аккаунт. Выберите каждый уместный ответ."
    type: MULTI_CHOICE
    options:
      - text: "Сначала навести курсор на ссылку, чтобы увидеть настоящий адрес назначения"
        isCorrect: true
      - text: "Проверить запрос через канал, которому вы уже доверяете, а не тот, что предоставило само сообщение"
        isCorrect: true
      - text: "Позвонить по номеру, указанному в сообщении, чтобы перепроверить"
        isCorrect: false
      - text: "Перейти по ссылке и посмотреть, как выглядит страница"
        isCorrect: false
      - text: "Сообщить о нём, если окажется, что это подделка"
        isCorrect: true
      - text: "Доверять ему, потому что оно использует ваше настоящее полное имя"
        isCorrect: false

  - text: "Сайт показывает значок замка и https в адресной строке. Что это на самом деле говорит?"
    type: SINGLE_CHOICE
    options:
      - text: "На сайте безопасно вводить свой пароль"
        isCorrect: false
      - text: "Соединение с этим сайтом зашифровано — это ничего не говорит о том, заслуживает ли доверия само место назначения"
        isCorrect: true
      - text: "Домен был проверен как легитимный"
        isCorrect: false
      - text: "Фишинговые сайты технически не могут использовать https"
        isCorrect: false

  - text: "Согласно отчёту Verizon Data Breach Investigations Report за 2025 год, какая примерно доля утечек начиналась с фишинга?"
    type: SINGLE_CHOICE
    options:
      - text: "Около 2%"
        isCorrect: false
      - text: "Около 16%"
        isCorrect: true
      - text: "Около 50%"
        isCorrect: false
      - text: "Около 90%"
        isCorrect: false
