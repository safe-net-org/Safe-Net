title: "Итоговый тест: Практика распознавания фишинга"
description: "Проверка вашей способности разбирать реалистичные примеры фишинга, вымышленные и реальные."
passingScore: 80
questions:
  - text: "Какой домен на самом деле НЕ является фишингом для банка под названием «YourBank»?"
    type: SINGLE_CHOICE
    options:
      - text: "yourbank-secure.com"
        isCorrect: false
      - text: "online.yourbank.com"
        isCorrect: true
      - text: "your-bank.com"
        isCorrect: false
      - text: "yourbank.online.com"
        isCorrect: false

  - text: "Письмо от банка утверждает, что была отмечена конкретная транзакция, но приветствует вас «Уважаемый клиент». Почему это подозрительно?"
    type: SINGLE_CHOICE
    options:
      - text: "«Уважаемый клиент» грамматически неверно"
        isCorrect: false
      - text: "Банк, отметивший вашу конкретную транзакцию, уже располагает вашим именем"
        isCorrect: true
      - text: "Банки никогда не говорят «уважаемый»"
        isCorrect: false
      - text: "Это слишком вежливо"
        isCorrect: false

  - text: "Выберите каждый настоящий тревожный признак в письме 2016 года, выдававшем себя за оповещение безопасности Google."
    type: MULTI_CHOICE
    options:
      - text: "Сокращённая ссылка bit.ly вместо настоящего домена Google"
        isCorrect: true
      - text: "Поддельная страница входа, просящая те же учётные данные, которые оповещение якобы защищало"
        isCorrect: true
      - text: "Письмо использовало настоящее имя получателя"
        isCorrect: false
      - text: "Письмо упоминало безопасность аккаунта"
        isCorrect: false
      - text: "Письмо пришло в будний день"
        isCorrect: false

  - text: "В том случае 2016 года, какая внутренняя ошибка пропустила отмеченное, подозрительное письмо?"
    type: SINGLE_CHOICE
    options:
      - text: "Сотрудники ИТ вообще не видели письмо"
        isCorrect: false
      - text: "Ответ, который должен был сказать «illegitimate», вместо этого сказал «legitimate»"
        isCorrect: true
      - text: "Письмо было случайно удалено до проверки"
        isCorrect: false
      - text: "Никто в организации не использовал инструменты безопасности почты"
        isCorrect: false

  - text: "Какая единственная проверка поймала бы тот случай 2016 года независимо от внутреннего недопонимания?"
    type: SINGLE_CHOICE
    options:
      - text: "Более длинный пароль аккаунта"
        isCorrect: false
      - text: "Наведение курсора на сокращённую ссылку, чтобы увидеть, что она не ведёт на настоящий домен Google"
        isCorrect: true
      - text: "Смена почтового провайдера"
        isCorrect: false
      - text: "Игнорирование всех оповещений безопасности"
        isCorrect: false

  - text: "Какую структуру разделяют вымышленное письмо от банка и реальный случай 2016 года?"
    type: SINGLE_CHOICE
    options:
      - text: "Оба использовали вредоносное вложение"
        isCorrect: false
      - text: "Оба использовали подделанную доверенную личность плюс ссылку на убедительную поддельную страницу действия"
        isCorrect: true
      - text: "Оба были нацелены только на топ-руководителей"
        isCorrect: false
      - text: "Оба были остановлены до того, как случился какой-либо ущерб"
        isCorrect: false

  - text: "Почему в фишинговое письмо включают дедлайн вроде «у вас есть 2 часа»?"
    type: SINGLE_CHOICE
    options:
      - text: "Чтобы соответствовать антиспам-регуляциям"
        isCorrect: false
      - text: "Чтобы сократить время, которое вы тратите на проверку всего остального перед действием"
        isCorrect: true
      - text: "Это стандартная часть всех сообщений от банков"
        isCorrect: false
      - text: "У этого нет реальной цели"
        isCorrect: false

  - text: "Какой самый надёжный способ проверить неожиданное письмо «ваш аккаунт в опасности»?"
    type: SINGLE_CHOICE
    options:
      - text: "Кликнуть по ссылке и посмотреть, выглядит ли страница легитимной"
        isCorrect: false
      - text: "Перейти напрямую на официальный сайт или в приложение самостоятельно, а не через ссылку из письма"
        isCorrect: true
      - text: "Ответить письмом с просьбой подтвердить"
        isCorrect: false
      - text: "Доверять, если оно использует ваше настоящее имя"
        isCorrect: false
