title: "Итоговый тест: Защита персональных данных"
description: "Проверка знаний о чувствительных данных и утечке Equifax."
passingScore: 80
questions:
  - text: "Какими из этих данных опасно делиться публично?"
    type: MULTI_CHOICE
    options:
      - text: "Номер вашего паспорта/удостоверения личности"
        isCorrect: true
      - text: "Ваш домашний адрес"
        isCorrect: true
      - text: "CVV-код вашей банковской карты"
        isCorrect: true
      - text: "Ваша любимая книга"
        isCorrect: false
      - text: "Фотография вашего питомца"
        isCorrect: false
      - text: "Ваш город или регион в целом, без точного адреса"
        isCorrect: false

  - text: "Что безопаснее всего указывать в публичном профиле?"
    type: SINGLE_CHOICE
    options:
      - text: "Ваш город или регион в целом, без точного адреса"
        isCorrect: true
      - text: "Ваш полный домашний адрес"
        isCorrect: false
      - text: "Скан вашего паспорта"
        isCorrect: false
      - text: "Номер вашей банковской карты"
        isCorrect: false

  - text: "Почему дата вашего рождения считается чувствительной информацией, даже если делиться ею кажется безобидным?"
    type: SINGLE_CHOICE
    options:
      - text: "Она часто используется как поле для проверки личности при восстановлении доступа к аккаунту"
        isCorrect: true
      - text: "У неё нет никакой практической ценности ни для кого"
        isCorrect: false
      - text: "Она нужна только для доступа к контенту с возрастными ограничениями"
        isCorrect: false
      - text: "Платформы обязаны публиковать её по закону"
        isCorrect: false

  - text: "Что реально может сделать злоумышленник, зная ваши полное имя, дату рождения и номер телефона вместе?"
    type: MULTI_CHOICE
    options:
      - text: "Попытаться оформить кредит на ваше имя"
        isCorrect: true
      - text: "Выдать себя за вас перед службой поддержки, чтобы вернуть доступ к вашим аккаунтам"
        isCorrect: true
      - text: "Отправить вам открытку на день рождения"
        isCorrect: false
      - text: "Ничего, без вашего явного согласия"
        isCorrect: false
      - text: "Напрямую подобрать пароль от вашего домашнего Wi-Fi"
        isCorrect: false

  - text: "Что нужно делать с документами, которыми приходится делиться, например со сканом удостоверения личности?"
    type: SINGLE_CHOICE
    options:
      - text: "Нанести на него видимый водяной знак перед отправкой"
        isCorrect: true
      - text: "Опубликовать его в открытом доступе, чтобы другие тоже могли подтвердить вашу личность"
        isCorrect: false
      - text: "Отправить его как можно большему числу сервисов, чтобы сэкономить время в будущем"
        isCorrect: false
      - text: "Никак нельзя снизить риск от передачи такого документа"
        isCorrect: false

  - text: "Сколько примерно американцев пострадало от утечки данных Equifax в 2017 году?"
    type: SINGLE_CHOICE
    options:
      - text: "Около 147 миллионов"
        isCorrect: true
      - text: "Около 14,7 миллиона"
        isCorrect: false
      - text: "Около 1,47 миллиона"
        isCorrect: false
      - text: "Около 1,4 миллиарда"
        isCorrect: false

  - text: "Что стало причиной утечки данных Equifax в 2017 году?"
    type: SINGLE_CHOICE
    options:
      - text: "Злоумышленники воспользовались неисправленной уязвимостью веб-приложения"
        isCorrect: true
      - text: "Сотрудник случайно отправил базу данных не тому адресату"
        isCorrect: false
      - text: "Физическое проникновение в штаб-квартиру Equifax"
        isCorrect: false
      - text: "Бывший сотрудник намеренно слил данные"
        isCorrect: false

  - text: "Помимо масштаба, почему утечка Equifax стала знаковым случаем в регулировании защиты данных?"
    type: SINGLE_CHOICE
    options:
      - text: "Equifax хранила данные как кредитное бюро, не имея прямых отношений с потребителями, — люди не могли отказаться от этого"
        isCorrect: true
      - text: "Это была первая утечка данных в истории вообще"
        isCorrect: false
      - text: "Персональные данные на самом деле не пострадали, только внутренние документы компании"
        isCorrect: false
      - text: "Пострадали только сами сотрудники Equifax"
        isCorrect: false
