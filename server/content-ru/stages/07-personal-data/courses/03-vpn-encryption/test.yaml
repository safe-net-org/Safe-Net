title: "Итоговый тест: VPN и шифрование"
description: "Проверка знаний основ VPN и случая Hola VPN."
passingScore: 80
questions:
  - text: "Главная цель VPN — это:"
    type: SINGLE_CHOICE
    options:
      - text: "Ускорить интернет"
        isCorrect: false
      - text: "Шифровать трафик и скрывать ваш IP-адрес"
        isCorrect: true
      - text: "Блокировать рекламу"
        isCorrect: false
      - text: "Увеличить скорость скачивания"
        isCorrect: false

  - text: "Что видит ваш интернет-провайдер, пока вы подключены к VPN?"
    type: SINGLE_CHOICE
    options:
      - text: "Только то, что вы подключены к серверу VPN, но не какие сайты вы посещаете"
        isCorrect: true
      - text: "Каждый посещённый вами сайт, в открытом, незашифрованном виде"
        isCorrect: false
      - text: "Вообще ничего, включая то, находитесь ли вы онлайн"
        isCorrect: false
      - text: "Ваши сохранённые пароли"
        isCorrect: false

  - text: "Какие из этих причин использовать VPN являются законными и реалистичными?"
    type: MULTI_CHOICE
    options:
      - text: "Защита трафика в публичных сетях Wi-Fi"
        isCorrect: true
      - text: "Скрытие активности в интернете от вашего провайдера"
        isCorrect: true
      - text: "Гарантия полной, постоянной анонимности в сети"
        isCorrect: false
      - text: "Полная неотслеживаемость незаконной деятельности"
        isCorrect: false
      - text: "Устранение отслеживания через цифровой отпечаток браузера и другие подобные методы"
        isCorrect: false

  - text: "Какой из этих критериев самый важный при выборе платного VPN-провайдера?"
    type: SINGLE_CHOICE
    options:
      - text: "Независимо проверенная политика отсутствия логов"
        isCorrect: true
      - text: "Самая красивая иконка приложения"
        isCorrect: false
      - text: "Первое место в рекламе поисковой системы"
        isCorrect: false
      - text: "Самая низкая цена, независимо от репутации"
        isCorrect: false

  - text: "Что должно насторожить вас в VPN-провайдере?"
    type: SINGLE_CHOICE
    options:
      - text: "Он идёт в комплекте с посторонним подозрительным приложением"
        isCorrect: true
      - text: "У него опубликована независимо проверенная политика отсутствия логов"
        isCorrect: false
      - text: "У него есть платный тариф с безлимитным трафиком"
        isCorrect: false
      - text: "Он поддерживает несколько устройств на одной подписке"
        isCorrect: false

  - text: "Что Hola VPN начала делать с интернет-соединениями своих бесплатных пользователей с конца 2014 года?"
    type: SINGLE_CHOICE
    options:
      - text: "Продавать доступ к их пропускной способности и IP-адресам как выходным узлам через платный сервис Luminati"
        isCorrect: true
      - text: "Жертвовать их свободную пропускную способность благотворительным организациям"
        isCorrect: false
      - text: "Использовать её исключительно для улучшения работы собственного приложения Hola"
        isCorrect: false
      - text: "Ничего — это миф без реальных оснований"
        isCorrect: false

  - text: "Какое событие в мае 2015 года привлекло публичное внимание к схеме выходных узлов Hola?"
    type: SINGLE_CHOICE
    options:
      - text: "Основатель 8chan обвинил Hola после того, как сайт был атакован через сеть Hola"
        isCorrect: true
      - text: "Hola добровольно раскрыла это в пресс-релизе"
        isCorrect: false
      - text: "Это раскрыло государственное расследование"
        isCorrect: false
      - text: "Это никогда не было публично раскрыто"
        isCorrect: false

  - text: "Какой конкретный риск создавала схема Hola для её бесплатных пользователей?"
    type: SINGLE_CHOICE
    options:
      - text: "Чужой трафик мог выходить через домашний IP-адрес обычного пользователя"
        isCorrect: true
      - text: "Их физические устройства могли быть безвозвратно повреждены"
        isCorrect: false
      - text: "Их аккаунты Hola автоматически удалялись"
        isCorrect: false
      - text: "Это не создавало никакого значимого риска"
        isCorrect: false
