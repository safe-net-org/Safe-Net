title: "Итоговый тест: Основы цифровой безопасности"
description: "Проверка знаний основ цифровой безопасности, антивирусов и обновлений."
passingScore: 70
questions:
  - text: "В чём заключается основная функция антивируса?"
    type: SINGLE_CHOICE
    options:
      - text: "Ускорение работы компьютера"
        isCorrect: false
      - text: "Защита от вредоносного ПО"
        isCorrect: true
      - text: "Увеличение скорости интернета"
        isCorrect: false
      - text: "Удаление ненужных файлов"
        isCorrect: false

  - text: "Как определить безопасное соединение с сайтом?"
    type: SINGLE_CHOICE
    options:
      - text: "Значок замка и https:// в адресной строке"
        isCorrect: true
      - text: "Красивый дизайн сайта"
        isCorrect: false
      - text: "Страница быстро загружается"
        isCorrect: false
      - text: "Очень длинное доменное имя"
        isCorrect: false

  - text: "Вирус-вымогатель уже зашифровал ваши файлы. Какая единственная мера заранее гарантирует, что вы вернёте их без выкупа?"
    type: SINGLE_CHOICE
    options:
      - text: "Запуск антивируса после обнаружения шифрования"
        isCorrect: false
      - text: "Надёжный уникальный пароль для входа"
        isCorrect: false
      - text: "Резервная копия, сделанная заранее и хранящаяся там, куда вымогатель не доберётся"
        isCorrect: true
      - text: "Двухфакторная аутентификация для почты"
        isCorrect: false

  - text: "Что из перечисленного относится к «человеческому фактору» во взломе, а не к чисто технической неисправности?"
    type: MULTI_CHOICE
    options:
      - text: "Переход по фишинговой ссылке"
        isCorrect: true
      - text: "Повторное использование пароля на разных сайтах"
        isCorrect: true
      - text: "Ошибочная настройка облачного хранилища с публичным доступом"
        isCorrect: true
      - text: "Уязвимость нулевого дня, о которой никто не знал"
        isCorrect: false
      - text: "Отказ жёсткого диска после многих лет использования"
        isCorrect: false
      - text: "Отключение электричества в дата-центре во время шторма"
        isCorrect: false

  - text: "Что в первую очередь достигается установкой обновления безопасности?"
    type: SINGLE_CHOICE
    options:
      - text: "Более приятный интерфейс"
        isCorrect: false
      - text: "Закрытие конкретной уязвимости, которой могли воспользоваться злоумышленники"
        isCorrect: true
      - text: "Более быстрый процессор"
        isCorrect: false
      - text: "Новые эмодзи"
        isCorrect: false

  - text: "Что из перечисленного является реальным признаком возможного заражения?"
    type: MULTI_CHOICE
    options:
      - text: "Необычно медленная работа без явной причины"
        isCorrect: true
      - text: "Антивирус постоянно отключается сам по себе"
        isCorrect: true
      - text: "Появляется обычное уведомление о доступном обновлении ОС"
        isCorrect: false
      - text: "Батарея немного быстрее садится в холодную погоду"
        isCorrect: false
      - text: "Браузер открывается на заданной вами домашней странице"
        isCorrect: false

  - text: "Сколько примерно времени патч для уязвимости, которую использовал WannaCry (EternalBlue), был доступен до атаки?"
    type: SINGLE_CHOICE
    options:
      - text: "Около 2 месяцев"
        isCorrect: true
      - text: "Около 2 лет"
        isCorrect: false
      - text: "Около 2 дней"
        isCorrect: false
      - text: "Он никогда не был доступен -- WannaCry использовал неизвестную уязвимость"
        isCorrect: false

  - text: "Ваш антивирус обновлён, но ОС не обновлялась 8 месяцев. Насколько вы защищены от известной, уже исправленной уязвимости?"
    type: SINGLE_CHOICE
    options:
      - text: "Полностью защищены одним антивирусом"
        isCorrect: false
      - text: "Не защищены от этой конкретной дыры -- антивирус не патчит ОС"
        isCorrect: true
      - text: "Защищены, если не открывать вложения"
        isCorrect: false
      - text: "Защищены, поскольку обновления устанавливаются автоматически независимо от настроек"
        isCorrect: false

  - text: "У вас есть 20 минут, чтобы сегодня улучшить свою цифровую безопасность. Какое действие даёт наибольшую отдачу?"
    type: SINGLE_CHOICE
    options:
      - text: "Купить премиум-подписку на антивирус"
        isCorrect: false
      - text: "Включить двухфакторную аутентификацию для основной почты"
        isCorrect: true
      - text: "Запомнить более длинный пароль для одного сайта"
        isCorrect: false
      - text: "Прочитать условия использования приложения"
        isCorrect: false
