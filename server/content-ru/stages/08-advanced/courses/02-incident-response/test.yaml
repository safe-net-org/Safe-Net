title: "Итоговый тест: Реагирование на инциденты"
description: "Проверка знаний о плане действий после взлома и сравнении MGM/Caesars."
passingScore: 80
questions:
  - text: "Что нужно сделать ПЕРВЫМ делом, если ваш аккаунт взломан?"
    type: SINGLE_CHOICE
    options:
      - text: "Написать в поддержку"
        isCorrect: false
      - text: "Отключиться от интернета и сменить пароль с другого устройства"
        isCorrect: true
      - text: "Удалить аккаунт"
        isCorrect: false
      - text: "Подождать несколько дней"
        isCorrect: false

  - text: "Какие из этого — реальные признаки того, что ваш аккаунт мог быть взломан?"
    type: MULTI_CHOICE
    options:
      - text: "Появляются публикации, которые вы не делали"
        isCorrect: true
      - text: "Вы получаете письмо «ваш пароль был изменён», которое не запрашивали"
        isCorrect: true
      - text: "Вы получили обычное уведомление об обновлении ПО"
        isCorrect: false
      - text: "Число ваших друзей постепенно росло со временем"
        isCorrect: false
      - text: "Вы успешно вошли, используя свой обычный пароль"
        isCorrect: false

  - text: "Почему пароль нужно менять с другого, чистого устройства, а не с потенциально скомпрометированного?"
    type: SINGLE_CHOICE
    options:
      - text: "Если на скомпрометированном устройстве установлен кейлоггер, ввод там нового пароля раскрывает и его тоже"
        isCorrect: true
      - text: "На самом деле это не важно — любое устройство подходит одинаково хорошо"
        isCorrect: false
      - text: "Смена пароля с того же устройства всегда быстрее и так же безопасна"
        isCorrect: false
      - text: "Это никак не влияет на безопасность"
        isCorrect: false

  - text: "Что нужно сделать, если в результате взлома были украдены деньги?"
    type: MULTI_CHOICE
    options:
      - text: "Заблокировать карту и связаться с банком"
        isCorrect: true
      - text: "Подать заявление в полицию"
        isCorrect: true
      - text: "Подождать, повторится ли это, прежде чем действовать"
        isCorrect: false
      - text: "Рассказать об этом только в соцсетях"
        isCorrect: false
      - text: "Избегать обращения в банк, чтобы не смущаться"
        isCorrect: false

  - text: "Какая одна из причин сохранить доказательства, например скриншоты, сразу после обнаружения взлома?"
    type: SINGLE_CHOICE
    options:
      - text: "Доказательства могут измениться или исчезнуть, а они могут понадобиться для поддержки или заявления в полицию"
        isCorrect: true
      - text: "Это требуется, прежде чем разрешат сменить пароль"
        isCorrect: false
      - text: "От них нет никакой практической пользы впоследствии"
        isCorrect: false
      - text: "Это заменяет необходимость обращаться в поддержку"
        isCorrect: false

  - text: "В атаках программ-вымогателей в сентябре 2023 года, чем ответ Caesars Entertainment отличался от ответа MGM Resorts?"
    type: SINGLE_CHOICE
    options:
      - text: "Caesars заплатила заявленный выкуп в 15 миллионов долларов и избежала серьёзных сбоев, а MGM отказалась платить и пострадала от простоев на протяжении примерно 10 дней"
        isCorrect: true
      - text: "Обе компании заплатили абсолютно одинаковую сумму выкупа"
        isCorrect: false
      - text: "Ни одна из компаний не пострадала от операционных сбоев"
        isCorrect: false
      - text: "MGM заплатила выкуп, а Caesars отказалась"
        isCorrect: false

  - text: "Каков был примерный финансовый ущерб для MGM Resorts от инцидента с программой-вымогателем в 2023 году?"
    type: SINGLE_CHOICE
    options:
      - text: "Около 100 миллионов долларов убытков в третьем квартале 2023 года"
        isCorrect: true
      - text: "Никакого измеримого финансового ущерба"
        isCorrect: false
      - text: "Около 1000 долларов"
        isCorrect: false
      - text: "Около 100 миллиардов долларов"
        isCorrect: false

  - text: "Какая группировка злоумышленников была связана и с атакой на MGM, и с атакой на Caesars в 2023 году?"
    type: SINGLE_CHOICE
    options:
      - text: "Scattered Spider"
        isCorrect: true
      - text: "Lazarus Group"
        isCorrect: false
      - text: "APT28"
        isCorrect: false
      - text: "ALPHV/BlackCat"
        isCorrect: false
