title: "Итоговый тест: Мошенничество в соцсетях"
description: "Проверка знаний о распространённых схемах мошенничества и данных FTC за 2025 год."
passingScore: 80
questions:
  - text: "Друг пишет вам: «Срочно пришли мне 50 долларов». Что делать?"
    type: SINGLE_CHOICE
    options:
      - text: "Сразу отправить деньги"
        isCorrect: false
      - text: "Позвонить другу, чтобы уточнить"
        isCorrect: true
      - text: "Попросить номер его карты в чате"
        isCorrect: false
      - text: "Попросить его самого позвонить вам"
        isCorrect: false

  - text: "Для чего на самом деле создан фальшивый розыгрыш «Сделай репост и выиграй iPhone!»?"
    type: SINGLE_CHOICE
    options:
      - text: "Раздуть число репостов и подписчиков страницы, чтобы она выглядела убедительно для будущего мошенничества"
        isCorrect: true
      - text: "По-настоящему разыграть бесплатную технику среди случайного участника"
        isCorrect: false
      - text: "Подтвердить, что ваш аккаунт настоящий"
        isCorrect: false
      - text: "Улучшить общую безопасность платформы"
        isCorrect: false

  - text: "Что из перечисленного является тревожным признаком в предложении работы, полученном через соцсети?"
    type: MULTI_CHOICE
    options:
      - text: "Нужно заранее заплатить за обучение или оборудование"
        isCorrect: true
      - text: "Оплату или сборы просят через подарочные карты или криптовалюту"
        isCorrect: true
      - text: "Работодатель проводит стандартную проверку биографии"
        isCorrect: false
      - text: "В вакансии чётко указана вилка зарплаты"
        isCorrect: false
      - text: "Процесс включает личное собеседование"
        isCorrect: false

  - text: "«Инвестиционная возможность» в группе WhatsApp обещает гарантированную высокую доходность и подкреплена отзывами участников. О чём это сигнализирует?"
    type: SINGLE_CHOICE
    options:
      - text: "Вероятное инвестиционное мошенничество — гарантированная доходность и постановочные отзывы являются классическими тревожными признаками"
        isCorrect: true
      - text: "Легитимный, низкорисковый инвестиционный клуб"
        isCorrect: false
      - text: "Особая, проверенная возможность раннего доступа"
        isCorrect: false
      - text: "Ничего тревожного — группы WhatsApp проверяются платформой"
        isCorrect: false

  - text: "Что нужно сделать перед тем, как перевести деньги по срочному сообщению от друга в соцсети?"
    type: SINGLE_CHOICE
    options:
      - text: "Проверить через отдельный канал связи, например позвонив"
        isCorrect: true
      - text: "Сначала отправить меньшую сумму, чтобы проверить"
        isCorrect: false
      - text: "Ответить в том же чате и спросить, правда ли это он"
        isCorrect: false
      - text: "Сначала переслать сообщение другим друзьям"
        isCorrect: false

  - text: "Согласно данным FTC за 2025 год, какова была общая сумма зафиксированных потерь от мошенничества в соцсетях?"
    type: SINGLE_CHOICE
    options:
      - text: "Около 2,1 миллиарда долларов"
        isCorrect: true
      - text: "Около 210 миллионов долларов"
        isCorrect: false
      - text: "Около 21 миллиарда долларов"
        isCorrect: false
      - text: "Около 2,1 миллиона долларов"
        isCorrect: false

  - text: "Какая категория мошенничества обеспечила наибольшую долю потерь от мошенничества в соцсетях в 2025 году?"
    type: SINGLE_CHOICE
    options:
      - text: "Инвестиционное мошенничество — 1,1 миллиарда долларов"
        isCorrect: true
      - text: "Романтическое мошенничество"
        isCorrect: false
      - text: "Фальшивые розыгрыши"
        isCorrect: false
      - text: "Мошенничество с благотворительностью"
        isCorrect: false

  - text: "На какой платформе соцсетей пришлось больше всего зафиксированных потерь от мошенничества по данным отчёта FTC за 2025 год?"
    type: SINGLE_CHOICE
    options:
      - text: "Facebook"
        isCorrect: true
      - text: "Snapchat"
        isCorrect: false
      - text: "LinkedIn"
        isCorrect: false
      - text: "Pinterest"
        isCorrect: false
