<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeNet Guard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: oklch(8% 0.008 250);
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif;
        color: oklch(98% 0 0);
        font-feature-settings: 'ss01', 'cv11';
      }
      #root { width: 100%; height: 100%; overflow-y: auto; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: oklch(22% 0.014 250); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: oklch(30% 0.018 250); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
